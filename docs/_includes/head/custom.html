<link rel="icon" type="image/svg+xml" href="https://github.githubassets.com/favicons/favicon.svg">

<!-- dynamic tags logic -->
{% if page.layout == 'single' and page.tags.size > 0 %}
<style>
  .portfolio-tags-wrapper { width: 100%; clear: both; }
  .portfolio-tags-title { font-size: 0.85rem !important; text-transform: uppercase; color: #888888 !important; margin-bottom: 12px !important; font-weight: 700 !important; }
  .portfolio-tags-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .portfolio-tag-pill {
    background: #111111; border: 1px solid #333333; color: #a1a1aa; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; display: inline-block;
  }
  .portfolio-tag-pill:hover { background: #1a1a1a; border-color: #ff0086; color: #ffffff; transform: translateY(-2px); }
  .tags-desktop { display: block; margin-top: 32px !important; padding-top: 24px !important; border-top: 1px solid #2a2a2a; }
  .tags-mobile { display: none; margin-top: 56px !important; margin-bottom: 56px !important; padding-top: 5px !important; }

  @media (min-width: 769px) {
    .author__urls-wrapper { max-height: none !important; overflow: visible !important; }
    .layout--single .sidebar, .sidebar.sticky { position: relative !important; top: 0 !important; height: auto !important; max-height: none !important; overflow: visible !important; transform: none !important; }
  }
  @media (max-width: 768px) {
    .tags-desktop { display: none !important; }
    .tags-mobile { display: block !important; }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const postTags = {{ page.tags | jsonify }};
    if (postTags && postTags.length > 0) {
      let tagsHtml = `<h4 class="portfolio-tags-title"><i class="fas fa-tags" style="margin-right: 6px;"></i> Tags</h4><div class="portfolio-tags-list">`;
      postTags.forEach(tag => { tagsHtml += `<span class="portfolio-tag-pill">${tag}</span>`; });
      tagsHtml += `</div>`;

      const sidebar = document.querySelector('.sidebar');
      if (sidebar) {
        const desktopTags = document.createElement('div');
        desktopTags.className = 'portfolio-tags-wrapper tags-desktop';
        desktopTags.innerHTML = tagsHtml;
        sidebar.appendChild(desktopTags);
      }
      const shareSection = document.querySelector('.page__share');
      if (shareSection) {
        const mobileTags = document.createElement('div');
        mobileTags.className = 'portfolio-tags-wrapper tags-mobile';
        mobileTags.innerHTML = tagsHtml;
        shareSection.parentNode.insertBefore(mobileTags, shareSection);
      }
    }
  });
</script>
{% endif %}

<!-- global scripts -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const links = document.querySelectorAll("a");
    links.forEach(link => {
      const href = link.getAttribute("href");
      if (href && !href.startsWith("#") && !href.startsWith("javascript:") && !href.startsWith("mailto:") && !href.startsWith("tel:")) {
        try {
          const url = new URL(link.href, window.location.origin);
          if (url.origin !== window.location.origin) {
            link.setAttribute("target", "_blank");
            link.setAttribute("rel", "noopener noreferrer");
          }
        } catch (e) {}
      }
    });

    const heroButtons = document.querySelectorAll('.page__hero--overlay .btn');
    heroButtons.forEach(btn => {
      btn.classList.forEach(className => {
        if (className.startsWith('btn--')) btn.classList.remove(className);
      });
      btn.classList.add('btn-elegant');
      if (!btn.querySelector('span')) {
        const rawText = btn.innerHTML;
        btn.innerHTML = `<span>${rawText}</span>`;
      }
    });

    const authorUrlsWrapper = document.querySelector('.author__urls-wrapper');
    if (authorUrlsWrapper) {
      const followBtn = authorUrlsWrapper.querySelector('button');
      if (followBtn) {
        const contactBtn = document.createElement('a');
        contactBtn.href = '/contacts/';
        contactBtn.className = 'btn-elegant mobile-contact-btn';
        contactBtn.style.height = '34px'; 
        contactBtn.style.padding = '0 16px';
        contactBtn.style.fontSize = '13px';
        contactBtn.style.marginTop = '12px';
        contactBtn.style.width = '100%';
        contactBtn.innerHTML = '<span>Contacts</span> <i class="fas fa-arrow-right" style="margin-left: 6px;"></i>';
        authorUrlsWrapper.replaceChild(contactBtn, followBtn);
      }
    }
  });
</script>
