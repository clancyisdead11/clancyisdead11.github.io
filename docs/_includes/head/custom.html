  .site-title {

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // 1. Ensure external links open in a new tab safely
    const links = document.querySelectorAll("a");
    links.forEach(link => {
      const href = link.getAttribute("href");
      if (href && !href.startsWith("#") && !href.startsWith("javascript:") && !href.startsWith("mailto:") && !href.startsWith("tel:")) {
        try {
          const url = new URL(link.href, window.location.origin);
          if (url.origin !== window.location.origin) {
            link.setAttribute("target", "_blank");
            link.setAttribute("rel", "noopener noreferrer");
          }
        } catch (e) {}
      }
    });

    // 2. HERO BUTTONS FIX (Forces them to behave exactly like profile cards)
    const heroButtons = document.querySelectorAll('.page__hero--overlay .btn');
    heroButtons.forEach(btn => {
      btn.classList.forEach(className => {
        if (className.startsWith('btn--')) {
          btn.classList.remove(className);
        }
      });
      btn.classList.add('btn-elegant');
      if (!btn.querySelector('span')) {
        const rawText = btn.innerHTML;
        btn.innerHTML = `<span>${rawText}</span>`;
      }
    });

    // 3. MOBILE AUTHOR PROFILE FIX: Replace "Follow" with "Contacts"
    const authorUrlsWrapper = document.querySelector('.author__urls-wrapper');
    if (authorUrlsWrapper) {
      const followBtn = authorUrlsWrapper.querySelector('button');
      if (followBtn) {
        // Create the new Contacts button
        const contactBtn = document.createElement('a');
        contactBtn.href = '/contacts/';
        contactBtn.className = 'btn-elegant mobile-contact-btn';
        
        // Inline styles to perfectly fit the author profile block
        contactBtn.style.height = '34px'; 
        contactBtn.style.padding = '0 16px';
        contactBtn.style.fontSize = '13px';
        contactBtn.style.marginTop = '12px';
        contactBtn.style.width = '100%';
        contactBtn.innerHTML = '<span>Contacts</span> <i class="fas fa-arrow-right" style="margin-left: 6px;"></i>';
        
        // Swap them out!
        authorUrlsWrapper.replaceChild(contactBtn, followBtn);
      }
    }
  });
</script>
